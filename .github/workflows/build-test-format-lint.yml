name: Build, Test, Format, Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 

      - name: Setup pmpn
        uses: pnpm/action-setup@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install node_modules 
        run: pnpm install --frozen-lockfile

      - name: Format repo
        run: pnpm exec prettier --check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 

      - name: Setup pmpn
        uses: pnpm/action-setup@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install node_modules 
        run: pnpm install --frozen-lockfile

      - name: Lint repo
        run: pnpm exec eslint .

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 

      - name: Setup pmpn
        uses: pnpm/action-setup@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install node_modules 
        run: pnpm install --frozen-lockfile

      - name: Build method
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 

      - name: Setup pmpn
        uses: pnpm/action-setup@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install node_modules 
        run: pnpm install --frozen-lockfile

      - name: Test method
        run: pnpm test