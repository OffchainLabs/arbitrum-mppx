name: Setup
description: Set up Node.js and pnpm, and install node_modules

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Setup pmpn
      uses: pnpm/action-setup@v4

    - name: Install node_modules
      run: pnpm install --frozen-lockfile
      shell: bash
